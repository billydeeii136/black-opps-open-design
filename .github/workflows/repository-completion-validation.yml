name: 'WSD Repository Completion Validation'

on:
  push:
    branches: [ main ]
    paths:
      - 'OPERATIONS.md'
      - 'automation/**'
      - '.github/workflows/repository-completion-validation.yml'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'OPERATIONS.md'
      - 'automation/**'
      - '.github/workflows/repository-completion-validation.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wsd-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Validate completion script syntax'
        shell: bash
        run: bash -n automation/validate_completion.sh

      - name: 'Validate WSD completion artifacts'
        shell: bash
        run: bash automation/validate_completion.sh
